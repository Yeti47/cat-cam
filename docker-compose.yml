services:
  ntfy:
    image: binwiederhier/ntfy
    container_name: cat-cam-ntfy
    command:
      - serve
      - --cache-file=/var/cache/ntfy/cache.db
      - --behind-proxy=false
      # Externally reachable URL on purpose: attachment links handed to the
      # phone are built from this, so it must NOT be the internal hostname.
      - --base-url=${NTFY_BASE_URL}
      - --attachment-cache-dir=/var/cache/ntfy/attachments
      - --attachment-total-size-limit=1G
      - --attachment-file-size-limit=50M
    volumes:
      - ./ntfy-server/cache:/var/cache/ntfy
    ports:
      # Netbird VPN interface only -- not the LAN, not the public internet.
      - "${NTFY_BIND_IP}:${NTFY_PORT}:80"
    restart: unless-stopped

  cat-cam:
    build: .
    container_name: cat-cam
    depends_on:
      - ntfy
    devices:
      - "${CAMERA_DEVICE}:${CAMERA_DEVICE}"
    # /dev/video1 is root:video 0660, so the container user needs the
    # host's video group as a supplementary group to read it.
    group_add:
      - "${VIDEO_GID}"
    user: "1000:1000"
    env_file:
      # Supplies the CATCAM_* application settings.
      - .env
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      # Runtime settings + snapshots. Unbound named volume: the app owns
      # this state entirely, and nothing tunable lives in the repo.
      - cat-cam-data:/data
    # Headroom over Docker's 10s default: streaming responses have to wind
    # down before the process can exit, and being SIGKILLed instead would
    # cut off an in-flight snapshot write.
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  cat-cam-data:
