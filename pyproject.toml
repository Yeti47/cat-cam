[project]
name = "cat-cam"
version = "0.1.0"
description = "Detect a cat waiting at the glass door via DroidCam and send a notification"
requires-python = ">=3.10,<3.13"
dependencies = [
    # headless: this app never opens a window, and the GUI build would drag
    # libGL/libglib into the container image for nothing.
    "opencv-python-headless>=4.9",
    "ultralytics>=8.3",
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Auto-discovery rather than an explicit list: the Docker build installs
# dependencies against a stub package before copying the real source, and
# an explicit list would demand every subpackage directory already exist.
[tool.setuptools.packages.find]
include = ["cat_cam*"]
